[project]
name = "serial-mcp-server"
version = "1.19.6"
description = "Headless MCP server that lets an AI read embedded-board serial logs (ESP32/STM32 etc.) during firmware debugging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "Silotek" }]
keywords = ["mcp", "serial", "esp32", "stm32", "firmware", "pyserial"]
dependencies = [
    "mcp[cli]>=1.10",
    "pyserial>=3.5",
]

# uvx / `uv run serial-mcp` 로 실행되는 엔트리포인트.
# 레포명(serial-mcp-server)과 무관하게 실행 명령은 짧게 serial-mcp.
[project.scripts]
serial-mcp = "serial_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serial_mcp"]

[dependency-groups]
dev = ["pytest>=8.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
